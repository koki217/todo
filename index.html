<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODO</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }

    .container {
      width: 100%;
      max-width: 560px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 28px;
      letter-spacing: -0.5px;
    }

    /* 入力フォーム */
    .add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .add-form input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .add-form input:focus { border-color: #555; }

    .add-form button {
      padding: 10px 18px;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .add-form button:hover { background: #444; }

    /* フィルタータブ */
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
    }

    .tab {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.875rem;
      cursor: pointer;
      background: transparent;
      border: 1.5px solid transparent;
      color: #666;
      transition: all 0.15s;
    }

    .tab:hover { color: #222; }

    .tab.active {
      background: #222;
      color: #fff;
      border-color: #222;
    }

    /* TODOリスト */
    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border: 1.5px solid #e8e8e8;
      border-radius: 10px;
      padding: 12px 14px;
      transition: opacity 0.2s;
    }

    .todo-item.done { opacity: 0.45; }

    .todo-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #222;
      flex-shrink: 0;
    }

    .todo-item .title {
      flex: 1;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .todo-item.done .title {
      text-decoration: line-through;
      color: #999;
    }

    .todo-item .meta {
      font-size: 0.75rem;
      color: #bbb;
      flex-shrink: 0;
    }

    .todo-item .btn-delete {
      background: none;
      border: none;
      color: #ccc;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
      flex-shrink: 0;
      transition: color 0.15s;
    }

    .todo-item .btn-delete:hover { color: #e55; }

    /* フッター */
    .footer {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: #aaa;
    }

    .btn-clear {
      background: none;
      border: none;
      color: #aaa;
      font-size: 0.8rem;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      transition: color 0.15s;
    }

    .btn-clear:hover { color: #e55; }

    /* 空状態 */
    .empty {
      text-align: center;
      color: #bbb;
      padding: 40px 0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>TODO</h1>

    <form class="add-form" id="addForm">
      <input type="text" id="titleInput" placeholder="新しいタスクを入力..." autocomplete="off">
      <button type="submit">追加</button>
    </form>

    <div class="tabs">
      <button class="tab active" data-filter="active">未完了</button>
      <button class="tab" data-filter="all">すべて</button>
    </div>

    <div class="todo-list" id="todoList"></div>

    <div class="footer">
      <span id="countLabel"></span>
      <button class="btn-clear" id="btnClear">完了済みを削除</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "todos";
    let showAll = false;
    let nextId = 1;

    // --- localStorage CRUD ---
    function load() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        nextId = data.nextId || 1;
        return data.todos || [];
      } catch {
        return [];
      }
    }

    function save(todos) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ todos, nextId }));
    }

    function addTodo(title) {
      const todos = load();
      const todo = {
        id: nextId++,
        title,
        done: false,
        created: new Date().toISOString().slice(0, 10),
      };
      todos.push(todo);
      save(todos);
      return todo;
    }

    function markDone(id) {
      const todos = load();
      const t = todos.find(t => t.id === id);
      if (t) { t.done = true; save(todos); }
    }

    function deleteTodoById(id) {
      save(load().filter(t => t.id !== id));
    }

    function clearDone() {
      save(load().filter(t => !t.done));
    }

    // --- 描画 ---
    function render() {
      const all = load();
      const todos = showAll ? all : all.filter(t => !t.done);
      const undone = all.filter(t => !t.done).length;

      document.getElementById("countLabel").textContent = `${undone} 件残っています`;

      const list = document.getElementById("todoList");
      if (todos.length === 0) {
        list.innerHTML = '<div class="empty">タスクはありません</div>';
        return;
      }

      list.innerHTML = todos.map(t => `
        <div class="todo-item ${t.done ? "done" : ""}">
          <input type="checkbox" ${t.done ? "checked disabled" : ""}
            onchange="onCheck(${t.id})">
          <span class="title">${escHtml(t.title)}</span>
          <span class="meta">${t.created}</span>
          <button class="btn-delete" onclick="onDelete(${t.id})" title="削除">×</button>
        </div>
      `).join("");
    }

    function escHtml(s) {
      return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    // --- イベント ---
    document.getElementById("addForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = document.getElementById("titleInput");
      const title = input.value.trim();
      if (!title) return;
      addTodo(title);
      input.value = "";
      render();
    });

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        showAll = tab.dataset.filter === "all";
        render();
      });
    });

    document.getElementById("btnClear").addEventListener("click", () => {
      clearDone();
      render();
    });

    function onCheck(id) { markDone(id); render(); }
    function onDelete(id) { deleteTodoById(id); render(); }

    render();
  </script>
</body>
</html>
